
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap Animation Game</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #111;
  overflow: hidden;
  font-family: Arial, sans-serif;
  user-select: none;
}

#loader {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  gap: 18px;
}

.progress {
  width: 75%;
  max-width: 300px;
  height: 8px;
  background: #333;
  border-radius: 20px;
  overflow: hidden;
}

#progressBar {
  width: 0%;
  height: 100%;
  background: #16c784;
  transition: width .2s;
}

#game {
  width: 100%;
  height: 100dvh;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}

#scene {
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
}

#tapArea {
  position: absolute;
  inset: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<div id="loader">
  <h2>Loading Game...</h2>
  <div class="progress">
    <div id="progressBar"></div>
  </div>
  <p id="loadingText">Loading images: 0/4</p>
</div>

<main id="game" class="hidden">
  <img id="scene" src="" draggable="false">
  <div id="tapArea"></div>
</main>

<script>
const imagePaths = [
  "images/1.png",
  "images/2.png",
  "images/3.png",
  "images/4.png"
];

const scene = document.getElementById("scene");
const game = document.getElementById("game");
const loader = document.getElementById("loader");
const progressBar = document.getElementById("progressBar");
const loadingText = document.getElementById("loadingText");
const tapArea = document.getElementById("tapArea");

let images = [];
let currentFrame = 0;
let isAnimating = false;

const FRAME_DELAY = 130;

// PRELOAD ALL IMAGES
async function preloadImages() {
  let completed = 0;

  try {
    images = await Promise.all(
      imagePaths.map(path => {
        return new Promise((resolve, reject) => {
          const img = new Image();

          img.onload = () => {
            completed++;
            progressBar.style.width =
              (completed / imagePaths.length * 100) + "%";

            loadingText.textContent =
              `Loading images: ${completed}/4`;

            resolve(img);
          };

          img.onerror = () => {
            reject(new Error("Failed: " + path));
          };

          img.src = path;
        });
      })
    );

    // FIRST IMAGE
    scene.src = images[0].src;

    loadingText.textContent = "Game Ready!";

    // OPEN GAME AFTER ALL IMAGES LOAD
    setTimeout(() => {
      loader.classList.add("hidden");
      game.classList.remove("hidden");
    }, 300);

  } catch (error) {
    loadingText.textContent =
      "Loading failed! Check image files and refresh.";
    console.error(error);
  }
}

// ANIMATION: IMAGE 1 → 2 → 3 → 4
function playAnimation() {
  if (isAnimating) return;

  isAnimating = true;

  let frame = 0;

  function nextFrame() {
    scene.src = images[frame].src;

    if (frame < 3) {
      frame++;
      setTimeout(nextFrame, FRAME_DELAY);
    } else {
      currentFrame = 3;
      isAnimating = false;
    }
  }

  nextFrame();
}

// TAP CONTROLS
tapArea.addEventListener("click", () => {

  if (isAnimating) return;

  if (currentFrame === 3) {

    // IMAGE 4 → IMAGE 1
    currentFrame = 0;
    scene.src = images[0].src;

  } else {

    // IMAGE 1 → IMAGE 2 → IMAGE 3 → IMAGE 4
    playAnimation();

  }

});

// START
preloadImages();

</script>
</body>
</html>
